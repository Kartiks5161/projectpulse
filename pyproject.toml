[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "projectpulse"
version = "0.1.0"
description = "Excel-based project-controls analytics and optimization engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kartik Sehra" },
]
dependencies = [
  "networkx>=3.2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.7",
]

[project.optional-dependencies]
advanced = [
  "numpy>=1.26",
  "ortools>=9.10",
  "scipy>=1.13",
  "xlsxwriter>=3.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/projectpulse"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
